sensor_mcu: thb
min_temp: 0
max_temp: 100

####################
# Filament Sensors #
####################

[filament_switch_sensor filament_entry]
switch_pin: ^thb:gpio3
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M117 Entry filament sensor triggered

[filament_switch_sensor filament_toolhead]
switch_pin: ^thb:gpio13
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M117 Toolhead filament runout
    PAUSE

 

################
# X/Y Steppers #
################

## X Stepper on Motor1(B Motor)
[stepper_x]
step_pin: X_STEP
dir_pin: X_DIR
enable_pin: !X_EN
rotation_distance: 32
microsteps: 32
full_steps_per_rotation:200 #400 for 0.9 deg steppers 
position_min: 0
homing_positive_dir: true
homing_speed: 60   
##  Uncomment for 180 build
position_endstop: 173
position_max: 173

##--------------------------------------------------------------------

###########################
#	Uncomment for Leviathan #
###########################

[tmc5160 stepper_x]
cs_pin: X_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075

##  Uncomment if using sensorless homing
[stepper_x]
endstop_pin: tmc5160_stepper_x:virtual_endstop
homing_retract_dist: 0
[tmc5160 stepper_x]
diag0_pin: ^!X_DIAG
driver_SGT: 1


